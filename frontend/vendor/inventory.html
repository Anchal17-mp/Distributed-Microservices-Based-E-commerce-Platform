<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Bazaario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    @media (max-width: 960px) {
      .dash-sidebar { display: none; }
      .dash-sidebar.open { display: flex; position: fixed; inset: 0; z-index: 500; width: 100%; }
      .mobile-sidebar-toggle { display: inline-flex !important; }
    }
    .mobile-sidebar-toggle { display: none; }
    .stock-input { width: 70px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar">
      <a class="brand" href="../index.html"><span class="brand-mark">B</span>Bazaario</a>
      <div class="side-user">
        <div class="av js-vendor-avatar">V</div>
        <div><b class="js-vendor-name">Vendor</b><span>Vendor · Approved</span></div>
      </div>
      <div class="side-label">Menu</div>
      <a class="side-link" href="dashboard.html">Dashboard</a>
      <a class="side-link" href="products.html">Products</a>
      <a class="side-link" href="orders.html">Orders</a>
      <a class="side-link is-active" href="inventory.html">Inventory</a>
      <div class="side-label">Account</div>
      <a class="side-link" href="#" onclick="vendorLogout()">Log Out</a>
    </aside>

    <main class="dash-main">
      <div class="dash-topbar">
        <button class="icon-btn mobile-sidebar-toggle" onclick="document.getElementById('dashSidebar').classList.toggle('open')">
          <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div><h1>Inventory</h1><p>Stock levels across all your listed products.</p></div>
        <div class="dash-top-actions" id="stockBadges"></div>
      </div>

      <div class="card panel">
        <table class="data-table">
          <thead><tr><th>Product</th><th>Stock</th><th>Level</th><th>Status</th><th>Update</th></tr></thead>
          <tbody id="inventoryTableBody">
            <tr><td colspan="5" style="color:var(--ink-soft);font-size:13.5px;padding:20px 0">Loading your inventory…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/vendor-common.js"></script>
  <script src="../js/inventory.js"></script>
</body>
</html>
